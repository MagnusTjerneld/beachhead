name: Test och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plocka ut spelkoden
        run: python3 tests/mk.py
      - name: Kartvalidering (tio öar)
        working-directory: tests
        run: node t23.js | tee map.log && ! grep -v "check ok" map.log | grep -q .
      - name: Strategiska punkter
        working-directory: tests
        run: node t51.js
      - name: Låsta sektorer, minor och inropning
        working-directory: tests
        run: node t58.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bygg sidan (bara spelet och musiken)
        run: mkdir -p _site/music && cp index.html _site/ && cp music/theme.mp3 _site/music/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
