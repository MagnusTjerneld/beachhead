name: Test och publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera three (modelltesterna)
        working-directory: tests
        run: npm ci --no-audit --no-fund
      - name: Alla snabba tester (tests/run.js bygger g2.js och kör dem parallellt)
        working-directory: tests
        run: RUN_N=$(nproc) node run.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bygg enhetsgalleriet ur spelets modeller och värden
        run: python3 proto/mkgalleri.py
      - name: Bygg sidan (spelet, musiken, enhetsgalleriet och trailern)
        run: mkdir -p _site/music _site/proto _site/trailer && cp index.html _site/ && cp music/theme.mp3 _site/music/ && cp proto/index.html proto/enhetsgalleri.html _site/proto/ && cp trailer/index.html _site/trailer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
