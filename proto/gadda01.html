<script>
/* Testbänk för GÄDDA 01 (Magnus designförslag 1 nov): GÄDDA före 1 nov (ur commiten före 0e513b9) bredvid den nya, mkGadda01, som har samma gränssnitt
   (THREE, {color, skin, lift, robots}; userData.launcher, caps, ram, setLift, jets) och kan ersätta den rakt av. Framåt är +x.
   node proto/gadda01.js [ut-mapp] renderar jämförelsen och modellkartan och räknar trianglar och material.
   Klicka för att växla; L lyfter och sänker robotlådan. */
const PI=Math.PI;

/* ---------- GÄDDA före 01, ur index.html i commiten före 0e513b9 ---------- */
function mkGadda(THREE,o){o=o||{};const col=o.color!=null?o.color:0x2fb3a8,TAU=Math.PI*2,PI=Math.PI;
  const M=c=>new THREE.MeshLambertMaterial({color:c}),B=c=>new THREE.MeshBasicMaterial({color:c});
  const mesh=(ge,m,x,y,z)=>{const q=new THREE.Mesh(ge,m);q.position.set(x||0,y||0,z||0);return q;};
  const box=(a,b,c)=>new THREE.BoxGeometry(a,b,c),cyl=(a,b,h,n)=>new THREE.CylinderGeometry(a,b,h,n||8);
  const sk=o.skin,HULL=M(sk?sk.b:0x4c5864),HULL2=M(sk?sk.a:0x56626e),BOT=M(0x22272b),DECK=M(sk?sk.c:0x5e6973),/* o.skin: the season's tone (issue 112) */DK=M(0x2a2e33),BLK=M(0x15181c),MET=M(0x7d7a72),
    LCH=M(sk?sk.c:0x606b75),CAP=M(0xd8dde0),T=M(col),WH=B(0xf4f6f8),RED=B(0xd8261c),GRN=B(0x1fbf4a);
  const g=new THREE.Group();
  /* a side profile (x,y) extruded across the boat, narrowed towards the bow (bowT) and towards the keel (vee), so the hull reads as a V
     with flat facets; the same shape cut at the waterline gives the dark bottom */
  const hullGeo=(pts,beam,y0,y1)=>{const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);
    const ge=new THREE.ExtrudeGeometry(s,{depth:beam,bevelEnabled:false,curveSegments:1,steps:1});ge.translate(0,0,-beam/2);
    const p=ge.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);
      const bowT=x>1.6?Math.max(.04,1-(x-1.6)/3.05):1,vee=y<.25?.3+.7*Math.max(0,(y+.55)/.8):1;p.setZ(i,p.getZ(i)*bowT*vee);}
    ge.computeVertexNormals();return ge;};
  const prof=[[-4.35,-.42],[2.4,-.5],[4.15,-.05],[4.65,.98],[1.5,1.0],[-4.35,.82]];
  g.add(mesh(hullGeo(prof,2.6),HULL));
  // the dark bottom: the hull below the waterline drawn again a hair wider, so the line between them is crisp
  {const bp=[[-4.37,-.44],[2.42,-.52],[4.12,-.07],[4.28,.08],[-4.37,.08]];const b=mesh(hullGeo(bp,2.64),BOT);g.add(b);}
  // the deck, a rubbing strip along the sheer, the side's colour under it, a lighter band on the bow's flare
  const dk=new THREE.Shape();dk.moveTo(-4.25,-1.18);dk.lineTo(1.4,-1.18);dk.lineTo(4.4,0);dk.lineTo(1.4,1.18);dk.lineTo(-4.25,1.18);dk.lineTo(-4.25,-1.18);
  const dg=new THREE.ExtrudeGeometry(dk,{depth:.06,bevelEnabled:false});dg.rotateX(-PI/2);
  const deck=mesh(dg,DECK,0,.86,0);g.add(deck);
  for(const sz of[-1,1]){
    const rs=mesh(box(5.9,.09,.09),DK,-1.35,.86,sz*1.28);g.add(rs);
    const st=mesh(box(5.6,.16,.04),T,-1.45,.66,sz*1.3);g.add(st);
    const fw=mesh(box(3.2,.08,.08),DK,2.9,.92,sz*.64);fw.rotation.y=sz*.39;fw.rotation.z=.01;g.add(fw);
    const fs=mesh(box(2.9,.14,.04),T,2.75,.72,sz*.66);fs.rotation.y=sz*.39;g.add(fs);}
  // a non-slip walkway down the middle and two cleats aft
  g.add(mesh(box(4.6,.02,.9),M(0x4a545d),-1.2,.93,0));for(const z of[-.95,.95])g.add(mesh(box(.3,.08,.08),MET,-3.95,.97,z));
  /* the sensor house: faceted, lower and narrower forward, no windows, a dark band of sensors round its front and sides */
  {const hs=new THREE.Shape();hs.moveTo(-.2,0);hs.lineTo(2.5,0);hs.lineTo(2.15,.62);hs.lineTo(1.9,.95);hs.lineTo(.2,1.05);hs.lineTo(-.2,.95);hs.lineTo(-.2,0);
    const hg=new THREE.ExtrudeGeometry(hs,{depth:1.5,bevelEnabled:true,bevelThickness:.08,bevelSize:.08,bevelSegments:1,curveSegments:1});hg.translate(0,0,-.75);
    g.add(mesh(hg,HULL2,0,.92,0));
    const bs=new THREE.Shape();bs.moveTo(1.55,.52);bs.lineTo(2.33,.52);bs.lineTo(2.2,.7);bs.lineTo(1.98,.84);bs.lineTo(1.55,.84);
    const bg=new THREE.ExtrudeGeometry(bs,{depth:1.72,bevelEnabled:false});bg.translate(0,0,-.86);g.add(mesh(bg,BLK,0,.92,0));
    // the side lights on the house's flanks, red to port and green to starboard
    g.add(mesh(box(.18,.1,.04),RED,1.2,1.62,-.86));g.add(mesh(box(.18,.1,.04),GRN,1.2,1.62,.86));
    // the electro-optical ball under the front of the house's roof
    const eo=new THREE.Group();eo.position.set(2.35,1.72,0);eo.add(mesh(cyl(.09,.09,.18,8),DK,0,.12,0));eo.add(mesh(new THREE.SphereGeometry(.24,10,8),DK,0,-.08,0));
    eo.add(mesh(box(.06,.12,.2),BLK,.21,-.08,0));g.add(eo);
    // a hatch and a vent on the roof
    g.add(mesh(box(.7,.05,.7),DK,.6,2.03,0));g.add(mesh(box(.35,.12,.25),DK,-.05,2.06,.45));}
  /* the mast: a tripod of short legs to a platform, the radar dome on top, two whips, the white mast light; a band in the side's colour */
  {const mx=.85,my=2.0;g.add(mesh(cyl(.07,.09,1.0,6),DK,mx,my+.5,0));
    for(const z of[-.35,.35]){const l=mesh(cyl(.035,.035,1.05,4),DK,mx-.15,my+.48,z*.55);l.rotation.x=z>0?-.33:.33;g.add(l);}
    g.add(mesh(cyl(.32,.32,.06,10),DK,mx,my+1.0,0));g.add(mesh(cyl(.33,.33,.08,10),T,mx,my+1.07,0));
    g.add(mesh(new THREE.SphereGeometry(.38,12,8,0,TAU,0,PI/2),M(0xdfe3e6),mx,my+1.1,0));
    g.add(mesh(cyl(.07,.07,.12,6),WH,mx,my+1.53,0));
    for(const z of[-.3,.3]){const w=mesh(cyl(.012,.02,1.7,4),BLK,mx-.35,my+1.5,z);w.rotation.z=.12;g.add(w);}}
  /* the launcher: a box of four tubes, two by two, on a hinge at its after end; it lies along the deck and lifts its front to fire. The
     caps on the tubes' front ends go one by one as they fire (robots: how many are left) */
  {const L=new THREE.Group();L.position.set(-3.75,1.02,0);g.add(L);g.userData.launcher=L;
    const lg=new THREE.Group();L.add(lg);
    lg.add(mesh(box(2.55,.62,1.46),LCH,1.27,.31,0));lg.add(mesh(box(2.6,.05,1.5),HULL2,1.27,.64,0));
    for(const z of[-.74,.74])lg.add(mesh(box(2.3,.05,.03),DK,1.2,.12,z));
    lg.add(mesh(box(.08,.5,1.36),T,2.36,.31,0));
    const caps=[];for(const[y,z]of[[.46,-.34],[.46,.34],[.16,-.34],[.16,.34]]){const c=mesh(cyl(.13,.13,.06,10),CAP,2.58,y,z);c.rotation.z=PI/2;lg.add(c);
      const h=mesh(cyl(.12,.12,.05,10),BLK,2.56,y,z);h.rotation.z=PI/2;lg.add(h);caps.push(c);}
    g.userData.caps=caps;
    // the hinge block and the lifting ram, which stretches as the box lifts
    g.add(mesh(box(.4,.22,1.2),DK,-3.75,.98,0));
    const ram=mesh(cyl(.07,.07,1,6),MET,0,0,0);g.add(ram);g.userData.ram=ram;
    const rob=o.robots==null?4:o.robots;caps.forEach((c,i)=>{c.visible=i<rob;});
    g.userData.setLift=t=>{L.rotation.z=t*.62;L.updateMatrix();const a=new THREE.Vector3(-1.9,.98,0),b=new THREE.Vector3(1.6,.08,0).applyAxisAngle(new THREE.Vector3(0,0,1),t*.62).add(L.position);
      const d=b.clone().sub(a);ram.position.copy(a).addScaledVector(d,.5);ram.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());ram.scale.set(1,Math.max(.2,d.length()),1);};
    g.userData.setLift(o.lift||0);}
  // the transom: two water jets with steering buckets, a step, the stern light
  {const jets=[];for(const z of[-.62,.62]){const j=new THREE.Group();j.position.set(-4.38,.12,z);j.add(mesh(cyl(.2,.24,.36,10),DK,0,0,0).rotateZ(PI/2));j.add(mesh(cyl(.17,.2,.2,10),BLK,-.24,0,0).rotateZ(PI/2));g.add(j);jets.push(j);}
    g.userData.jets=jets;g.add(mesh(box(.12,.1,2.1),DK,-4.38,.55,0));g.add(mesh(box(.06,.08,.14),WH,-4.4,.84,0));}
  // a fender line low on the bow and the towing eye
  g.add(mesh(cyl(.05,.05,.3,6),MET,4.52,.95,0).rotateZ(PI/2));
  g.traverse(q=>{if(q.isMesh){q.castShadow=true;q.receiveShadow=true;}});
  return g;}

/* ---------- GÄDDA 01 ---------- */
function mkGadda01(THREE,o){o=o||{};const col=o.color!=null?o.color:0x2fb3a8,TAU=Math.PI*2,PI=Math.PI;
  /* the whole boat is drawn at 9.53 m and scaled up at the end to 10 % longer than the GÄDDA before it (9.39 m, Magnus 1 nov) */
  const SC=1.084;
  const M=c=>new THREE.MeshLambertMaterial({color:c}),B=c=>new THREE.MeshBasicMaterial({color:c});
  const mesh=(ge,m,x,y,z)=>{const q=new THREE.Mesh(ge,m);q.position.set(x||0,y||0,z||0);return q;};
  const box=(a,b,c)=>new THREE.BoxGeometry(a,b,c),cyl=(a,b,h,n)=>new THREE.CylinderGeometry(a,b,h,n||8),V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const sk=o.skin,HULL=M(sk?sk.a:0x6f7c88),HULL2=M(sk?sk.b:0x5e6a75),BOT=M(0x1b1c1e),DK=M(0x232629),BLK=M(0x111316),MET=M(0x7d7a72),
    CAP=M(0xd8dde0),T=M(col),WH=B(0xf4f6f8),RED=B(0xd8261c),GRN=B(0x1fbf4a);
  /* a faceted body: closed profiles [[z,y],...] at stations along x, joined face to face and capped with a fan from each end's middle,
     flat shaded, every face turned away from the body's middle (the bodies are convex); userData.convex lets a bench test contact */
  const loft=secs=>{const P=[],c=V(0,0,0);let n=0;for(const[x,A]of secs)for(const q of A){c.add(V(x,q[1],q[0]));n++;}c.divideScalar(n);
    const add=(a,b,d)=>{const e=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(d,a)),m=a.clone().add(b).add(d).divideScalar(3).sub(c);P.push(...(e.dot(m)<0?[a,d,b]:[a,b,d]));};
    for(let s=0;s<secs.length-1;s++){const[xa,A]=secs[s],[xb,Bq]=secs[s+1];for(let k=0;k<A.length;k++){const k1=(k+1)%A.length;add(V(xa,A[k][1],A[k][0]),V(xb,Bq[k][1],Bq[k][0]),V(xb,Bq[k1][1],Bq[k1][0]));add(V(xa,A[k][1],A[k][0]),V(xb,Bq[k1][1],Bq[k1][0]),V(xa,A[k1][1],A[k1][0]));}}
    for(const[x,A]of[secs[0],secs[secs.length-1]]){const m=V(x,A.reduce((a,q)=>a+q[1],0)/A.length,A.reduce((a,q)=>a+q[0],0)/A.length);for(let k=0;k<A.length;k++){const k1=(k+1)%A.length;add(m,V(x,A[k][1],A[k][0]),V(x,A[k1][1],A[k1][0]));}}
    const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.Float32BufferAttribute(P.flatMap(p=>[p.x,p.y,p.z]),3));ge.computeVertexNormals();ge.userData.convex=true;ge.userData.secs=secs;return ge;};
  /* a thin part laid flat on the plane through three points, at x,z on it, its underside just touching */
  const onFace=(q,A,Bp,C,x,z)=>{const a=V(...A),nn=V(...Bp).sub(a).cross(V(...C).sub(a)).normalize();if(nn.y<0)nn.negate();const y=a.y-(nn.x*(x-a.x)+nn.z*(z-a.z))/nn.y;
    q.quaternion.setFromUnitVectors(V(0,1,0),nn);q.position.set(x,y,z).addScaledVector(nn,q.geometry.parameters.height/2-.005);return q;};
  const g=new THREE.Group();
  /* a patch in the side's colour (or any material) that lies on one strip of a loft: strip k runs from profile point k to k+1; u goes
     along x from x0 to x1 (sk shifts x with v, for a slanted edge), v across the strip from v0 to v1; lifted 1.2 cm along out, so it
     follows the body's own faces and never hangs in the air */
  const patch=(secs,k,x0,x1,v0,v1,m,out,sk,n)=>{n=n||Math.max(1,Math.ceil(Math.abs(x1-x0)/.5));sk=sk||0;const at=(x,v)=>{let i=0;while(i<secs.length-2&&secs[i+1][0]<x)i++;
      const[xa,A]=secs[i],[xb,Bq]=secs[i+1],t=Math.min(1,Math.max(0,(x-xa)/(xb-xa))),k1=(k+1)%A.length,l=(p,q,s)=>p+(q-p)*s,
        za=l(A[k][0],A[k1][0],v),ya=l(A[k][1],A[k1][1],v),zb=l(Bq[k][0],Bq[k1][0],v),yb=l(Bq[k][1],Bq[k1][1],v);return V(x,l(ya,yb,t),l(za,zb,t)).addScaledVector(out,.012);};
    const P=[];for(let j=0;j<n;j++){const u0=j/n,u1=(j+1)/n,X=(u,v)=>x0+(x1-x0)*u+sk*(v-v0)/(v1-v0||1),a=at(X(u0,v0),v0),b=at(X(u1,v0),v0),c=at(X(u1,v1),v1),d=at(X(u0,v1),v1);
      for(const[p,q,r]of[[a,b,c],[a,c,d]]){const e=new THREE.Vector3().subVectors(q,p).cross(new THREE.Vector3().subVectors(r,p));P.push(...(e.dot(out)<0?[p,r,q]:[p,q,r]));}}
    const ge=new THREE.BufferGeometry();ge.setAttribute('position',new THREE.Float32BufferAttribute(P.flatMap(p=>[p.x,p.y,p.z]),3));ge.computeVertexNormals();return new THREE.Mesh(ge,m);};
  /* the hull (GÄDDA 01, Magnus design 1 nov): narrow, with a long sharp bow; each station gives the keel, the chine, the line where the
     black bottom meets the grey side (higher aft), and the deck edge. The bottom and the side are two bodies sharing that line */
  const ST=[[-4.35,-.36,[1.08,-.12],[1.3,.48],[1.26,.9]],[0,-.5,[1.02,-.2],[1.3,.36],[1.26,.92]],[2.2,-.46,[.88,-.14],[1.14,.28],[1.1,.95]],
    [3.7,-.12,[.36,.04],[.48,.21],[.48,1.0]],[4.8,.3,[.03,.32],[.04,.36],[.04,1.03]]];
  const UP=ST.map(([x,k,c,s,d])=>[x,[[-s[0],s[1]],[s[0],s[1]],[d[0],d[1]],[0,d[1]+.03],[-d[0],d[1]]]]);
  g.add(mesh(loft(ST.map(([x,k,c,s])=>[x,[[-c[0],c[1]],[0,k],[c[0],c[1]],[s[0],s[1]],[-s[0],s[1]]]])),BOT));g.add(mesh(loft(UP),HULL));
  /* the side's colour on the hull's own faces: a long stripe along each side, a short slash near the bow, a panel each side of the bow
     deck that the game's camera sees; strips 1 and 4 of the upper hull are the sides (+z and -z), 2 and 3 the deck */
  for(const sz of[-1,1]){const out=V(0,.25,sz).normalize(),side=sz>0?1:4,sv=v=>sz>0?v:1-v;
    g.add(patch(UP,side,-4.15,1.75,sv(.3),sv(.5),T,out,0,6));g.add(patch(UP,side,2.45,2.85,sv(.25),sv(.6),T,out,.22,1));
    const dk=sz>0?2:3,dv=v=>sz>0?v:1-v;g.add(patch(UP,dk,3.75,4.25,dv(.12),dv(.62),T,V(0,1,0),0,2));
    g.add(mesh(box(.5,.08,.08),DK,1.9,.98,sz*1.02));/* a cleat */}
  /* the sensor ridge: low and faceted, sloping sides, a raked back and a long slope down to the bow, where the sensor module sits;
     no windows. Its profile is [-b,-s,-r,r,s,b]: strips 0 and 4 are the lower sides, 1 and 3 the shoulders, 2 the roof */
  {const p=(bz,yb,sz,ys,rz,yr)=>[[-bz,yb],[-sz,ys],[-rz,yr],[rz,yr],[sz,ys],[bz,yb]],R=[[-1.05,p(.86,.9,.62,1.18,.32,1.28)],[-.7,p(.86,.9,.62,1.5,.32,1.68)],[1.5,p(.86,.9,.62,1.5,.32,1.68)],
      [2.7,p(.68,.93,.48,1.36,.26,1.48)],[3.55,p(.4,.97,.3,1.02,.16,1.05)]];
    g.add(mesh(loft(R),HULL2));
    for(const sz of[-1,1]){const out=V(0,.6,sz).normalize(),lo=sz>0?4:0,sh=sz>0?3:1,v=q=>sz>0?q:1-q;
      g.add(patch(R,sh,1.75,2.6,v(.12),v(.88),T,V(.3,.8,sz*.6).normalize(),.25,2));/* the shoulders of the slope in the side's colour */
      g.add(patch(R,lo,.55,1.25,v(.25),v(.7),DK,V(0,.3,sz).normalize(),0,1));g.add(patch(R,lo,-.55,-.1,v(.3),v(.65),DK,V(0,.3,sz).normalize(),0,1));/* dark sensor panels, not one band */
      g.add(patch(R,lo,1.3,1.42,v(.45),v(.6),sz<0?RED:GRN,V(0,.3,sz).normalize(),0,1));
      /* the Swedish flag (issue 111), the hoist on the viewer's left on both sides, never mirrored: aft on +z, forward on -z; blue, then the yellow cross a little proud of it */
      {const o=V(0,.3,sz).normalize(),x0=1.62,x1=2.02,w=x1-x0,BL=M(0x1f5c9e),YE=M(0xf0c020),up=q=>{q.position.addScaledVector(o,.008);return q;},cx=sz>0?x0+w*6/16:x1-w*6/16;g.add(patch(R,lo,x0,x1,v(.3),v(.72),BL,o,0,1));
        g.add(up(patch(R,lo,cx-w/16,cx+w/16,v(.3),v(.72),YE,o,0,1)));g.add(up(patch(R,lo,x0,x1,v(.468),v(.552),YE,o,0,1)));}}
    g.add(patch(R,2,1.0,1.4,.2,.8,DK,V(0,1,0),0,1));g.add(mesh(box(.3,.1,.22),DK,-.35,1.72,-.15));}
  /* the sensor module at the top of the slope: a dark angular block with four lenses, two by two, and a white light beside them */
  {g.add(mesh(box(.5,.44,.6),DK,3.15,1.3,0));g.add(mesh(box(.32,.12,.48),DK,3.08,1.57,0));
    for(const[y,z]of[[1.22,-.12],[1.22,.12],[1.39,-.12],[1.39,.12]])g.add(mesh(cyl(.075,.075,.06,6),BLK,3.41,y,z).rotateZ(PI/2));g.add(mesh(box(.04,.08,.12),WH,3.41,1.3,.24));}
  /* the mast: a faceted base from the roof, a band in the side's colour, the radar dome, the white mast light, and two whips from the roof behind it */
  {const mx=.6;g.add(mesh(cyl(.16,.3,.7,6),DK,mx,2.02,0));g.add(mesh(cyl(.3,.3,.08,8),T,mx,2.4,0));
    g.add(mesh(new THREE.SphereGeometry(.36,10,6,0,TAU,0,PI*.6),M(0xdfe3e6),mx,2.44,0));g.add(mesh(cyl(.06,.06,.1,6),WH,mx,2.83,0));
    for(const z of[-.16,.16]){g.add(mesh(box(.12,.1,.12),DK,mx-.55,1.72,z));g.add(mesh(cyl(.012,.02,1.6,4),BLK,mx-.55,2.56,z));}}
  /* the launcher, a separate module that is changed at Birka: a faceted box of four tubes, two by two, on a hinge at its after end; it
     lies along the deck and lifts its front to fire. The caps on the tubes' front ends go one by one as they fire (robots: how many are left) */
  {const L=new THREE.Group();L.position.set(-3.75,1.02,0);g.add(L);g.userData.launcher=L;const lg=new THREE.Group();L.add(lg);
    const q=(w,h,c)=>[[-w,0],[-w-.03,h-.16],[-c,h],[c,h],[w+.03,h-.16],[w,0]];
    lg.add(mesh(loft([[.05,q(.72,.7,.55)],[2.3,q(.72,.7,.55)],[2.6,q(.62,.6,.45)]]),HULL));
    lg.add(mesh(box(1.1,.04,.62),T,1.15,.71,0));lg.add(mesh(box(.5,.04,.3),DK,1.95,.67,0));
    for(const z of[-.62,.62])lg.add(mesh(box(.32,.6,.26),DK,.12,.3,z));/* dark corner blocks at the hinge end */
    const caps=[];for(const[y,z]of[[.42,-.27],[.42,.27],[.16,-.27],[.16,.27]]){const c=mesh(cyl(.12,.12,.05,8),CAP,2.62,y,z);c.rotation.z=PI/2;lg.add(c);
      const h=mesh(cyl(.11,.11,.04,8),BLK,2.6,y,z);h.rotation.z=PI/2;lg.add(h);caps.push(c);}
    g.userData.caps=caps;
    // the mount: the hinge block, a grey plinth with a dark edge each side and the lifting ram, which stretches as the box lifts
    g.add(mesh(box(.4,.22,1.3),DK,-3.75,.98,0));g.add(mesh(box(2.75,.14,1.78),HULL2,-2.5,.97,0));for(const z of[-.885,.885])g.add(mesh(box(2.6,.06,.04),DK,-2.5,1.0,z));
    const ram=mesh(cyl(.07,.07,1,6),MET,0,0,0);g.add(ram);g.userData.ram=ram;
    const rob=o.robots==null?4:o.robots;caps.forEach((c,i)=>{c.visible=i<rob;});
    g.userData.setLift=t=>{L.rotation.z=t*.62;L.updateMatrix();const a=V(-1.9,.98,0).multiplyScalar(SC),b=V(1.6,.08,0).multiplyScalar(SC).applyAxisAngle(V(0,0,1),t*.62).add(L.position);
      const d=b.clone().sub(a);ram.position.copy(a).addScaledVector(d,.5);ram.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());ram.scale.set(1,Math.max(.2,d.length()/SC),1);};}
  // the transom: two water jets with steering buckets, dark corner bumpers, a step and the stern light
  {const jets=[];for(const z of[-.62,.62]){const j=new THREE.Group();j.position.set(-4.38,.12,z);j.add(mesh(cyl(.2,.24,.36,10),DK,0,0,0).rotateZ(PI/2));j.add(mesh(cyl(.17,.2,.2,10),BLK,-.24,0,0).rotateZ(PI/2));g.add(j);jets.push(j);}
    g.userData.jets=jets;for(const z of[-1.05,1.05])g.add(mesh(box(.26,.5,.32),DK,-4.4,.66,z));g.add(mesh(box(.12,.1,1.7),DK,-4.4,.5,0));g.add(mesh(box(.06,.08,.14),WH,-4.37,.82,0));}
  g.add(mesh(cyl(.05,.05,.3,6),MET,4.66,.95,0).rotateZ(PI/2));/* the towing eye */
  const done=new Set();g.traverse(q=>{if(q===g)return;q.position.multiplyScalar(SC);if(q.isMesh&&!done.has(q.geometry)){done.add(q.geometry);q.geometry.scale(SC,SC,SC);const sc=q.geometry.userData.secs;
    if(sc)q.geometry.userData.secs=sc.map(([x,A])=>[x*SC,A.map(([z,y])=>[z*SC,y*SC])]);}if(q.isMesh){q.castShadow=true;q.receiveShadow=true;}});
  g.userData.setLift(o.lift||0);
  return g;}

/* ---------- scenen: neutral bakgrund, som en modellkarta ---------- */
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(1);R.shadowMap.enabled=true;R.setClearColor(0xdcdee0);
const S=new THREE.Scene();S.add(new THREE.HemisphereLight(0xffffff,0x9a9a90,.75));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(30,50,22);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});sun.shadow.mapSize.set(2048,2048);S.add(sun);
const fl=new THREE.Mesh(new THREE.CircleGeometry(60,48),new THREE.ShadowMaterial({opacity:.22}));fl.rotation.x=-PI/2;fl.position.y=-.56;fl.receiveShadow=true;S.add(fl);
const tris=o=>{let n=0;o.traverse(c=>{if(!c.isMesh)return;const gg=c.geometry;n+=(gg.index?gg.index.count:gg.attributes.position.count)/3;});return Math.round(n);};
/* materials, by colour and kind: what the game's bake leaves as draw calls is fewer (one per kind of material outside the launcher) */
const mats=o=>{const s=new Set();o.traverse(c=>{if(c.isMesh)s.add(c.material.type+c.material.color.getHexString());});return s.size;};
const MODELS={old:mkGadda,new:mkGadda01};let cur=null,col=0x2fb3a8,lift=0;
function show(ver,l){if(l!=null)lift=l;if(cur)S.remove(cur);cur=MODELS[ver](THREE,{color:col,lift});S.add(cur);
  const b=new THREE.Box3().setFromObject(cur),s=b.getSize(new THREE.Vector3());return{tri:tris(cur),mats:mats(cur),len:+s.x.toFixed(2),wid:+s.z.toFixed(2),h:+s.y.toFixed(2),foot:+b.min.y.toFixed(2)};}
const cam=new THREE.PerspectiveCamera(22,1,.1,500);
function shoot(az,el,w,hh,d){R.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix();const a=az*PI/180,e=el*PI/180;d=d||30;
  cam.position.set(Math.cos(a)*Math.cos(e)*d,1+Math.sin(e)*d,Math.sin(a)*Math.cos(e)*d);cam.up.set(el>80?-1:0,el>80?0:1,0);cam.lookAt(0,1,0);R.render(S,cam);return R.domElement.toDataURL('image/jpeg',.9);}
/* parts that touch no other part: boxes, grown 2 cm, must meet, and where the other part is a convex loft (geometry.userData.convex)
   one of this part's corners must lie within 3 cm of the loft's inside */
function inside(o,p,eps){const P=o.geometry.attributes.position,a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<P.count;i+=3){a.fromBufferAttribute(P,i).applyMatrix4(o.matrixWorld);b.fromBufferAttribute(P,i+1).applyMatrix4(o.matrixWorld);c.fromBufferAttribute(P,i+2).applyMatrix4(o.matrixWorld);
    n.crossVectors(b.clone().sub(a),c.clone().sub(a));if(n.lengthSq()<1e-12)continue;n.normalize();if(n.dot(p.clone().sub(a))>eps)return false;}return true;}
function touch(a,o){if(!a.b.clone().expandByScalar(.02).intersectsBox(o.b))return false;if(!o.c.geometry.userData.convex)return true;
  const P=a.c.geometry.attributes.position,v=new THREE.Vector3();for(let i=0;i<P.count;i++){v.fromBufferAttribute(P,i).applyMatrix4(a.c.matrixWorld);if(inside(o.c,v,.03))return true;}
  if(a.c.geometry.userData.convex){const Q=o.c.geometry.attributes.position;for(let i=0;i<Q.count;i++){v.fromBufferAttribute(Q,i).applyMatrix4(o.c.matrixWorld);if(inside(a.c,v,.03))return true;}}return false;}
function loose(){cur.updateMatrixWorld(true);const L=[];cur.traverse(c=>{if(c.isMesh&&c.visible)L.push({c,b:new THREE.Box3().setFromObject(c)});});
  return L.filter(a=>!L.some(o=>o!==a&&(touch(a,o)||touch(o,a)))).map(a=>{const p=a.b.getCenter(new THREE.Vector3());return a.c.geometry.type.replace('Geometry','')+' vid '+[p.x,p.y,p.z].map(v=>v.toFixed(2)).join(',');});}
/* sizes from the geometry itself, not its parameters, which a scaled geometry keeps unscaled */
const dims=ge=>{ge.computeBoundingBox();const s=ge.boundingBox.getSize(new THREE.Vector3());return{width:s.x,height:s.y,depth:s.z};};
/* a close camera looking at x=lx, y=ly on the centre line */
function shootAt(az,el,w,hh,d,lx,ly){R.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix();const a=az*PI/180,e=el*PI/180;
  cam.position.set(lx+Math.cos(a)*Math.cos(e)*d,ly+Math.sin(e)*d,Math.sin(a)*Math.cos(e)*d);cam.up.set(0,1,0);cam.lookAt(lx,ly,0);R.render(S,cam);return R.domElement.toDataURL('image/jpeg',.9);}
/* boxes that hang out in the air: a corner is held when it lies within 3 cm of the inside of a loft, another box or a cylinder (its widest radius); a thin
   plate (one side at most 6 cm) must have all four corners of one face held, any other box at least four of its eight */
function hangs(){cur.updateMatrixWorld(true);const all=[];cur.traverse(c=>{if(c.isMesh&&c.visible)all.push(c);});const inv=new THREE.Matrix4(),q=new THREE.Vector3(),out=[];
  const held=(p,self)=>all.some(o=>{if(o===self)return false;if(o.geometry.userData.convex)return inside(o,p,.03);if(o.geometry.type==='CylinderGeometry'){inv.copy(o.matrixWorld).invert();q.copy(p).applyMatrix4(inv);const P=dims(o.geometry);return Math.abs(q.y)<=P.height/2+.03&&Math.hypot(q.x,q.z)<=P.width/2+.03;}if(o.geometry.type!=='BoxGeometry')return false;
    inv.copy(o.matrixWorld).invert();q.copy(p).applyMatrix4(inv);const P=dims(o.geometry);return Math.abs(q.x)<=P.width/2+.03&&Math.abs(q.y)<=P.height/2+.03&&Math.abs(q.z)<=P.depth/2+.03;});
  for(const c of all){if(c.geometry.type!=='BoxGeometry')continue;const P=dims(c.geometry),h=[P.width/2,P.height/2,P.depth/2],thin=h.findIndex(v=>v<=.03),C=[];
    for(const sx of[-1,1])for(const sy of[-1,1])for(const sz of[-1,1])C.push({s:[sx,sy,sz],ok:held(new THREE.Vector3(sx*h[0],sy*h[1],sz*h[2]).applyMatrix4(c.matrixWorld),c)});
    const ok=thin>=0?[-1,1].some(f=>C.filter(k=>k.s[thin]===f).every(k=>k.ok)):C.filter(k=>k.ok).length>=4;
    if(!ok){const p=new THREE.Vector3().setFromMatrixPosition(c.matrixWorld);out.push('Box '+[P.width,P.height,P.depth].join('×')+' vid '+[p.x,p.y,p.z].map(v=>v.toFixed(2)).join(','));}}
  return out;}
/* inside a loft, exactly: the profile at the point's x (in the loft's own frame) interpolated between its stations, and the point
   within eps of that polygon; replaces the test against every face, which a loft whose deck rises towards the bow is not convex for */
function inside(o,p,eps){const S=o.geometry.userData.secs;if(!S)return false;const q=p.clone().applyMatrix4(new THREE.Matrix4().copy(o.matrixWorld).invert());
  if(q.x<S[0][0]-eps||q.x>S[S.length-1][0]+eps)return false;let i=0;while(i<S.length-2&&S[i+1][0]<q.x)i++;const[xa,A]=S[i],[xb,B]=S[i+1],t=Math.min(1,Math.max(0,(q.x-xa)/(xb-xa)));
  const poly=A.map((a,k)=>[a[0]+(B[k][0]-a[0])*t,a[1]+(B[k][1]-a[1])*t]),cz=poly.reduce((s,a)=>s+a[0],0)/poly.length,cy=poly.reduce((s,a)=>s+a[1],0)/poly.length;
  for(let k=0;k<poly.length;k++){const[z0,y0]=poly[k],[z1,y1]=poly[(k+1)%poly.length],ez=z1-z0,ey=y1-y0,L=Math.hypot(ez,ey);if(L<1e-6)continue;
    let nz=ey/L,ny=-ez/L;if(nz*(cz-z0)+ny*(cy-y0)>0){nz=-nz;ny=-ny;}if(nz*(q.z-z0)+ny*(q.y-y0)>eps)return false;}return true;}
window.BENCH={show,shoot,shootAt,loose,hangs,get cur(){return cur;}};
if(!location.search.includes('bench')){const lab=document.getElementById('lab');let t0=performance.now(),v='new';
  const put=()=>{const r=show(v);lab.innerHTML='<b>'+(v==='new'?'GÄDDA 01':'GÄDDA i dag')+'</b> · '+r.tri+' trianglar, '+r.mats+' material · '+r.len+' × '+r.wid+' × '+r.h+' m · klicka för att växla, L lyfter lådan';};put();
  document.body.onclick=()=>{v=v==='new'?'old':'new';put();};addEventListener('keydown',e=>{if(e.key==='l'||e.key==='L'){lift=lift?0:1;put();}});
  const loop=()=>{const s=(performance.now()-t0)/1000;R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
    cam.position.set(Math.cos(s*.3)*20,7,Math.sin(s*.3)*20);cam.up.set(0,1,0);cam.lookAt(0,1,0);R.render(S,cam);requestAnimationFrame(loop);};loop();}
