<html lang="sv"><head><meta charset="utf-8"><title>Nya modeller: KROK och BÄVER</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#cfd8de;overflow:hidden;font:14px system-ui,sans-serif}#lbl{position:fixed;left:12px;top:10px;color:#1b2630;font-weight:600}</style>
</head><body><div id="lbl"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Prototypes for issue 68 (Magnus 20 okt): KROK as an unmanned tandem-rotor helicopter (from 21 okt after Magnus's own design 02A), and BÄVER
   as an engineer vehicle in field olive with yellow warning details. Pictures only (decided 20 okt): nothing here is in the game yet.
   The helpers, light and scale are the game's, so the models read as they would there. No real names, logos or copied shapes. */
const PI=Math.PI,TAU=PI*2,MATS=new Map(),GEOS=new Map();
function mat(c){const key='#'+c.toString(16).padStart(6,'0');if(!MATS.has(key))MATS.set(key,new THREE.MeshLambertMaterial({color:new THREE.Color(key)}));return MATS.get(key);}
function box(w,h,d){const k='b'+w+','+h+','+d;if(!GEOS.has(k))GEOS.set(k,new THREE.BoxGeometry(w,h,d));return GEOS.get(k);}
function cyl(a,b,h,n){const k='c'+a+','+b+','+h+','+n;if(!GEOS.has(k))GEOS.set(k,new THREE.CylinderGeometry(a,b,h,n));return GEOS.get(k);}
function mesh(geo,m,x,y,z){const o=new THREE.Mesh(geo,m);o.position.set(x||0,y||0,z||0);return o;}
function rotor(n,len,w,tip,col){const r=new THREE.Group();r.add(mesh(cyl(w*.9,w*.9,w*.8,8),mat(0x22282e),0,0,0));
  for(let i=0;i<n;i++){const b=new THREE.Group();b.rotation.y=i*TAU/n;b.add(mesh(box(len,w*.3,w),mat(col||0x22282e),len/2,0,0));b.add(mesh(box(len*.12,w*.32,w*1.02),mat(tip||0xd8dde0),len*.94,0,0));r.add(b);}
  return r;}

/* KROK 02A (21 okt, Magnus's own design sheet "KROK / 02A, höjdförskjutna rotorer"): a long faceted yellow body in three sections,
   nose and tail tapering, the belly raised between the sections so the hook hangs clear; a short pylon forward and a tall one aft so
   the two four-bladed rotors pass over each other; four long crane legs splayed out to twin wheels, high enough to straddle a load;
   a dark sensor window in the nose, a dark tail with red lights and a striped hook block under the middle */
function facet(pts,depth,bev,taper){const sh=new THREE.Shape();sh.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)sh.lineTo(pts[i][0],pts[i][1]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:depth-2*bev,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:1,curveSegments:1});g.translate(0,0,-(depth-2*bev)/2);
  if(taper){const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,p.getZ(i)*taper(p.getX(i)));g.computeVertexNormals();}return g;}
function frust(rt,rb,h,sx,sz){const g=new THREE.CylinderGeometry(rt,rb,h,8).toNonIndexed();g.rotateY(PI/8);g.scale(sx,1,sz);g.computeVertexNormals();return g;}
function strut(a,b,t,m){const d=new THREE.Vector3().subVectors(b,a),L=d.length(),o=new THREE.Mesh(box(t,L,t),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o;}
function krok02(col,load){col=col||0xe8b224;const g=new THREE.Group(),Y=mat(col),DK=mat(0x2a2c30),BLK=mat(0x1b1c1e),MET=mat(0x7d7a72),SEN=mat(0x15181c),
    WH=new THREE.MeshBasicMaterial({color:0xf4f6f8}),RED=new THREE.MeshBasicMaterial({color:0xd8261c}),AMB=new THREE.MeshBasicMaterial({color:0xf0a020}),V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const nose=x=>x>4.2?1-.4*(x-4.2)/2.6:1,tail=x=>x<-5.4?1-.22*(-5.4-x)/1.3:1;
  // the three sections: the nose section, a slightly narrower middle with the belly raised, and the tail section
  // (the tapering nose and tail are pieces of their own, so their faces stay flat; the joints read as panel seams)
  g.add(mesh(facet([[1.6,.5],[2.2,0],[4.2,0],[4.2,1.95],[1.6,1.95]],2.3,.42),Y));g.add(mesh(facet([[4.2,0],[6.2,0],[6.75,.5],[6.75,1.0],[5.6,1.55],[4.2,1.95]],2.3,.42,nose),Y));
  g.add(mesh(facet([[2.0,.45],[2.0,1.9],[-3.3,1.9],[-3.3,.45]],2.05,.36),Y));
  g.add(mesh(facet([[-2.8,.45],[-2.8,1.95],[-5.4,1.95],[-5.4,0],[-3.3,0]],2.3,.42),Y));g.add(mesh(facet([[-5.4,1.95],[-6.1,1.95],[-6.7,1.35],[-6.7,.55],[-6.2,0],[-5.4,0]],2.3,.42,tail),Y));
  // the dark sensor window across the front of the nose and round its sides, a light at each corner; the dark tail with red lights
  // (the body's bevel grows the profile by .42, so the nose's front face sits at x 7.17 and the window reaches past it)
  g.add(mesh(facet([[5.95,.0],[7.24,.38],[7.24,1.12],[6.0,1.45]],1.6,.12),SEN));
  for(const z of[-.66,.66])g.add(mesh(box(.12,.1,.14),WH,7.3,.5,z));
  g.add(mesh(facet([[-6.45,.42],[-6.79,.6],[-6.79,1.32],[-6.45,1.58]],1.86,.1),SEN));
  for(const z of[-.8,.8])g.add(mesh(box(.1,.1,.12),RED,-6.8,1.25,z));
  // the short forward pylon and the tall aft pylon, so the aft rotor runs well above the forward one
  g.add(mesh(frust(.42,.72,.7,1.35,1.0),Y,4.25,2.3,0));g.add(mesh(cyl(.24,.3,.26,8),DK,4.25,2.78,0));g.add(mesh(box(.3,.05,.08),WH,3.55,2.5,0));
  const r1=rotor(4,4.8,.52,col);r1.position.set(4.25,2.98,0);r1.add(mesh(cyl(.6,.6,.16,10),DK,0,-.05,0));r1.add(mesh(new THREE.SphereGeometry(.3,10,6,0,TAU,0,PI/2),DK,0,.1,0));g.add(r1);
  g.add(mesh(frust(.55,1.05,2.1,1.3,1.0),Y,-4.9,3.0,0));g.add(mesh(cyl(.3,.38,.3,8),DK,-4.9,4.2,0));g.add(mesh(box(.4,.05,.08),WH,-4.2,3.95,0));
  const r2=rotor(4,4.8,.52,col);r2.position.set(-4.9,4.42,0);r2.rotation.y=PI/4;r2.add(mesh(cyl(.6,.6,.16,10),DK,0,-.05,0));r2.add(mesh(new THREE.SphereGeometry(.3,10,6,0,TAU,0,PI/2),DK,0,.1,0));g.add(r2);r1.userData.rotor=r2.userData.rotor=true;
  // a sensor box and a beacon on the back, vent slots along the middle section
  g.add(mesh(facet([[.2,1.85],[.2,2.2],[-.6,2.2],[-.6,1.85]],.6,.06),DK,0,0,0));g.add(mesh(cyl(.1,.12,.16,8),AMB,-1.6,2.0,0));
  for(const z of[-1.03,1.03])g.add(mesh(box(.9,.06,.03),BLK,-.4,1.35,z));
  // four crane legs: a heavy strut from the body's corner out and down to a knee, a lighter brace from further in, twin wheels
  for(const[hx,bx,fx]of[[4.0,2.3,5.2],[-4.3,-2.6,-5.5]])for(const s of[-1,1]){
    const hip=V(hx,.12,s*.95),knee=V(fx,-1.8,s*2.25),axle=V(fx,-2.4,s*2.35);
    g.add(mesh(box(.7,.36,.5),DK,hx,.08,s*.95));g.add(strut(hip,knee,.32,DK));g.add(strut(knee,axle,.26,DK));
    g.add(strut(V(bx,.12,s*.8),hip.clone().lerp(knee,.62),.16,DK));g.add(mesh(box(.4,.4,.4),DK,knee.x,knee.y,knee.z));
    g.add(mesh(box(.2,.2,.62),DK,fx,-2.4,s*2.35));
    for(const dz of[-.21,.21]){const w=mesh(cyl(.45,.45,.26,16),BLK,fx,-2.4,s*2.35+dz);w.rotation.x=PI/2;g.add(w);const hb=mesh(cyl(.17,.17,.28,10),MET,fx,-2.4,s*2.35+dz);hb.rotation.x=PI/2;g.add(hb);}}
  // the hook under the middle: a frame from the belly, a block in yellow and black bands, the hook
  g.add(strut(V(-1.15,.47,0),V(-.6,.02,0),.12,DK));g.add(strut(V(-.05,.47,0),V(-.6,.02,0),.12,DK));g.add(mesh(box(1.4,.12,.4),DK,-.6,.48,0));
  const pl=mesh(cyl(.13,.13,.2,10),MET,-.6,0,0);pl.rotation.x=PI/2;g.add(pl);
  for(let i=0;i<4;i++)g.add(mesh(box(.36,.12,.3),i%2?BLK:Y,-.6,-.2-.12*i,0));
  const hk=mesh(new THREE.TorusGeometry(.14,.045,6,14,PI*1.5),DK,-.6,-.84,0);hk.rotation.z=PI*.75;g.add(hk);
  if(load){const gy=-2.85,OL=mat(0x4f5b38),WD=mat(0x8a6038);
    g.add(mesh(box(1.8,.14,1.25),WD,-.6,gy+.07,0));for(const z of[-.5,0,.5])g.add(mesh(box(1.8,.06,.14),WD,-.6,gy+.17,z));
    g.add(mesh(facet([[.25,gy+.2],[.25,gy+.95],[-1.45,gy+.95],[-1.45,gy+.2]],1.15,.06),OL));
    for(const x of[-1.1,-.1])g.add(mesh(box(.08,.78,1.19),BLK,x,gy+.58,0));
    for(const[x,z]of[[.18,.5],[.18,-.5],[-1.38,.5],[-1.38,-.5]])g.add(strut(V(-.6,-.95,0),V(x,gy+.96,z),.04,BLK));}
  return g;}

/* BÄVER, engineer vehicle: an armoured six-wheeler with a sloped glacis, a dozer blade with yellow and black warning edge, a folded
   excavator arm on the roof with a yellow bucket, a low armoured cab with narrow vision blocks, stowage boxes, a rear winch,
   an amber beacon and an antenna; the hull is field olive */
function baverIng(){const g=new THREE.Group(),OL=mat(0x4f5b38),OL2=mat(0x434d30),OL3=mat(0x5b6842),DK=mat(0x2e2e2c),BLK=mat(0x1b1c1e),MET=mat(0x7d7a72),GL=mat(0x5d7a86),YE=mat(0xe0b02e);
  // wheels and lower hull
  for(const x of[-2.1,0,2.1])for(const z of[-1.75,1.75]){const w=mesh(cyl(.78,.78,.55,12),BLK,x,.78,z);w.rotation.x=PI/2;g.add(w);const hb=mesh(cyl(.3,.3,.58,8),MET,x,.78,z);hb.rotation.x=PI/2;g.add(hb);}
  g.add(mesh(box(6,1.0,3.0),OL2,0,1.15,0));
  // the armoured upper hull, sloped at the front, with side skirts over the wheels
  g.add(mesh(box(4.8,1.3,3.6),OL,-.5,2.25,0));const gl=mesh(box(1.8,1.25,3.6),OL,2.35,2.0,0);gl.rotation.z=-.62;g.add(gl);
  for(const z of[-1.82,1.82])g.add(mesh(box(6.1,.5,.12),OL3,0,1.75,z));
  // the cab, low and armoured, on the left with narrow vision blocks, so the arm can lie along the right
  g.add(mesh(box(1.9,1.0,1.9),OL3,.8,3.4,-.75));g.add(mesh(box(.08,.22,1.4),GL,1.76,3.55,-.75));g.add(mesh(box(.9,.2,.06),GL,.9,3.55,-1.71));
  g.add(mesh(cyl(.17,.19,.24,8),mat(0xf0a020),.4,4.02,-1.2));g.add(mesh(cyl(.025,.025,2.2,4),DK,-.3,5.0,-1.4));
  // the dozer blade on two arms, warning edge in yellow and black blocks
  const bl=mesh(box(.32,1.2,4.0),OL2,3.85,.95,0);bl.rotation.z=.15;g.add(bl);
  for(let i=0;i<8;i++)g.add(mesh(box(.34,.22,.5),i%2?BLK:YE,3.95,1.62,-1.75+i*.5));
  g.add(mesh(box(.14,.18,4.0),MET,4.0,.32,0));for(const z of[-1.2,1.2]){const a=mesh(box(1.3,.22,.25),DK,3.2,1.05,z);a.rotation.z=-.25;g.add(a);}
  // the excavator arm on a slewing base at the rear right, lying along the roof, the stick folded down at the front and the bucket,
  // yellow as a warning, resting above the glacis
  g.add(mesh(cyl(.6,.65,.45,12),OL3,-2.0,3.12,.85));const boom=mesh(box(4.0,.44,.5),OL,0,3.62,.85);boom.rotation.z=.03;g.add(boom);
  g.add(mesh(cyl(.08,.08,2.6,6),MET,-.3,3.95,.85).rotateZ(PI/2));
  const st=mesh(box(1.5,.38,.42),OL,2.15,3.15,.85);st.rotation.z=-1.05;g.add(st);
  const bk=new THREE.Group();bk.position.set(2.75,2.55,.85);bk.rotation.z=-.4;bk.add(mesh(box(.75,.6,.95),YE,0,0,0));for(let i=0;i<4;i++)bk.add(mesh(box(.12,.18,.12),MET,.34,-.36,-.33+i*.22));g.add(bk);
  // stowage boxes, a jerrycan rack, the rear winch, tail lights, and a yellow and black warning panel at the back
  g.add(mesh(box(1.2,.55,.6),OL3,-.9,3.15,-1.35));g.add(mesh(box(1.0,.5,1.0),OL3,-2.4,3.12,-.8));
  for(const z of[-.5,0,.5])g.add(mesh(box(.12,.5,.36),OL2,-3.0,2.4,z));
  g.add(mesh(cyl(.3,.3,1.4,10),DK,-3.05,1.35,0).rotateX(PI/2));
  for(let i=0;i<6;i++)g.add(mesh(box(.06,.18,.45),i%2?BLK:YE,-3.04,1.8,-1.25+i*.5));
  for(const z of[-1.3,1.3])g.add(mesh(box(.06,.2,.3),mat(0xb02a20),-3.04,1.25,z));
  return g;}

const W=innerWidth,H=innerHeight,ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(W,H);ren.setPixelRatio(1);ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0xcfd8de);sc.fog=new THREE.Fog(0xcfd8de,80,220);
sc.add(new THREE.HemisphereLight(0xdfe9f2,0x6b6a55,.75));const sun=new THREE.DirectionalLight(0xfff2dc,.85);sun.position.set(30,45,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});sc.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x7d8a5a));gr.rotation.x=-PI/2;gr.receiveShadow=true;sc.add(gr);
const q=new URLSearchParams(location.search),v=q.get('v')||'krok-sida';
const kind=v.split('-')[0],m=kind==='krok'?krok02(/oliv/.test(v)?0x4f5b38:0,/last/.test(v)):baverIng();m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});m.traverse(o=>{if(o.userData.rotor)o.traverse(c=>c.castShadow=false);});  // the rotors spin in the game; a still blade's shadow only reads as stripes
if(kind==='krok')m.position.y=/under/.test(v)?0:2.85;if(/under/.test(v))gr.visible=false;sc.add(m);
const views={'krok-fram':[26,3.6,0,0,3.3,0],'krok-bak':[-26,3.6,0,0,3.3,0],'krok-sida':[0,3.4,28,0,3.2,0],'krok-ovan':[0,32,.01,0,0,0],'krok-under':[0,-30,.01,0,0,0],
  'krok-snett':[17,11,19,0,3,0],'krok-last':[9,3.2,19,-.5,2.6,0],'krok-mark':[13,6,14,0,2.5,0],
  'baver-sida':[0,3.5,13,0,2,0],'baver-snett':[9,6,9,.5,2,0],'baver-bak':[-9,5,7,0,2,0],'baver-ovan':[1,14,3,0,2,0]};
const c=views[v]||views['krok-sida'],cam=new THREE.PerspectiveCamera(38,W/H,.1,500);cam.position.set(c[0],c[1],c[2]);cam.lookAt(c[3],c[4],c[5]);
ren.render(sc,cam);document.getElementById('lbl').textContent=v;window.DONE=true;
</script></body></html>
